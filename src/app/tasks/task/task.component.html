<section class="task">
    <button type="button" class="edit__btn" (click)="editTask()">
        <svg height="14" width="14" fill="#fff" viewBox="0 0 640 640">
            <path
                d="M416.9 85.2L372 130.1L509.9 268L554.8 223.1C568.4 209.6 576 191.2 576 172C576 152.8 568.4 134.4 554.8 120.9L519.1 85.2C505.6 71.6 487.2 64 468 64C448.8 64 430.4 71.6 416.9 85.2zM338.1 164L122.9 379.1C112.2 389.8 104.4 403.2 100.3 417.8L64.9 545.6C62.6 553.9 64.9 562.9 71.1 569C77.3 575.1 86.2 577.5 94.5 575.2L222.3 539.7C236.9 535.6 250.2 527.9 261 517.1L476 301.9L338.1 164z" />
        </svg>
    </button>
    <div class="task-head">
        <h2 class="task__title">{{task().title}}</h2>
        <div class="task-head__controls">
            <button type="button" class="del-task__btn" (click)="removeTask(task().id)">Remove Task</button>
            <select class="task__select" [ngModel]="task().status" (ngModelChange)="updateStatus($event)">
                <option value="OPEN">Open</option>
                <option value="IN-PROGRESS">In-progress</option>
                <option value="DONE">Completed</option>
            </select>
        </div>
    </div>
    <p class="task__des">{{task().des}}</p>

    @if(isEditing) {
    <app-edit-task (close)="closeEditModal()" [task]="task()" />
    }
</section>
